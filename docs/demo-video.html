<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySQL AI Chatbot - Interactive Demo Video</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes pulseLive {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.7; }
    }
    .live-dot {
      animation: pulseLive 1.8s infinite ease-in-out;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .video-viewport {
      aspect-ratio: 16 / 9.2;
      background: #020617;
    }
    .custom-cursor {
      position: absolute;
      width: 20px;
      height: 20px;
      pointer-events: none;
      z-index: 50;
      transition: transform 0.08s ease-out;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
    }
    .click-ripple {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #38bdf8;
      pointer-events: none;
      z-index: 49;
      transform: translate(-50%, -50%) scale(0.2);
      opacity: 1;
      animation: rippleAnim 0.4s ease-out forwards;
    }
    @keyframes rippleAnim {
      to { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-3 sm:p-5 m-0 select-none">

  <!-- Main Video Player Container -->
  <div class="max-w-4xl mx-auto rounded-2xl overflow-hidden shadow-2xl border border-slate-800 bg-slate-900 flex flex-col">
    
    <!-- Top Player Header Bar -->
    <div class="bg-slate-900/90 px-4 py-2.5 border-b border-slate-800 flex items-center justify-between text-xs text-slate-300">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 live-dot"></span>
        <span class="font-bold tracking-wide text-white">MySQL AI Chatbot</span>
        <span class="bg-slate-800 text-slate-400 px-2 py-0.5 rounded text-[11px] font-mono">1080p • 60 FPS</span>
      </div>
      <div class="flex items-center gap-3 text-slate-400">
        <span id="currentChapterTitle" class="text-sky-400 font-medium">1. Login Screen & MySQL Identity</span>
      </div>
    </div>

    <!-- Virtual Screen Viewport -->
    <div id="videoContainer" class="video-viewport relative overflow-hidden flex flex-col justify-between cursor-pointer" onclick="togglePlayPause()">
      
      <!-- Virtual Animated Mouse Cursor -->
      <div id="virtualCursor" class="custom-cursor top-1/2 left-1/2" style="transform: translate(-50%, -50%);">
        <svg viewBox="0 0 24 24" fill="none" class="w-6 h-6">
          <path d="M4 3L11 20L14 13L21 10L4 3Z" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- Watermark Badge -->
      <div class="absolute top-3 right-3 z-30 pointer-events-none flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-950/70 border border-slate-800/80 text-[11px] text-slate-300 backdrop-blur-md">
        <span>🐬 MySQL 8.0</span>
        <span class="text-slate-600">•</span>
        <span class="text-sky-400 font-semibold">RBAC Verified</span>
      </div>

      <!-- Interactive Render Screen -->
      <div id="screenStage" class="w-full h-full p-4 sm:p-6 flex items-center justify-center relative">
        <!-- Injected via JavaScript based on playback timestamp -->
      </div>

      <!-- Dynamic Subtitles Overlay -->
      <div class="absolute bottom-4 inset-x-4 z-30 pointer-events-none flex justify-center">
        <div id="subtitleBox" class="bg-slate-950/85 backdrop-blur-md border border-slate-700/60 px-4 py-1.5 rounded-xl text-center max-w-xl shadow-lg transition-all duration-300">
          <p id="subtitleText" class="text-xs sm:text-sm font-medium text-slate-100">Welcome to MySQL AI Chatbot. Choose your role to authenticate.</p>
          <p id="subtitleSub" class="text-[11px] text-sky-400 mt-0.5">लॉगिन स्क्रीनवर Reader, Writer, किंवा Admin रोल निवडा.</p>
        </div>
      </div>

      <!-- Big Center Play / Pause Indicator (Fades out when playing) -->
      <div id="bigPlayBtn" class="absolute inset-0 z-40 bg-slate-950/40 flex items-center justify-center transition-opacity duration-300">
        <div class="w-16 h-16 rounded-full bg-sky-500/90 text-white flex items-center justify-center shadow-2xl backdrop-blur-md hover:scale-110 transition-transform">
          <svg id="bigPlayIcon" class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
      </div>

    </div>

    <!-- Bottom Video Controls Bar -->
    <div class="bg-slate-950 px-4 py-3 border-t border-slate-800/90 flex flex-col gap-2.5">
      
      <!-- Progress Scrubber Bar -->
      <div class="relative w-full h-2 bg-slate-800 rounded-full cursor-pointer group" onclick="seekVideo(event)">
        <div id="progressBar" class="absolute top-0 left-0 h-full bg-gradient-to-r from-sky-500 to-rose-500 rounded-full w-0 transition-all duration-75"></div>
        <div id="scrubberHandle" class="absolute top-1/2 -mt-2 w-4 h-4 rounded-full bg-white shadow-lg border border-slate-300 transform -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-opacity"></div>
      </div>

      <!-- Controls Row -->
      <div class="flex items-center justify-between text-xs text-slate-300">
        <div class="flex items-center gap-3">
          <!-- Play / Pause -->
          <button type="button" onclick="togglePlayPause()" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white transition-colors" title="Play/Pause (Space)">
            <svg id="playPauseIcon" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>

          <!-- Rewind 5s -->
          <button type="button" onclick="skipTime(-5)" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition-colors" title="Rewind 5s">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.334 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z"/>
            </svg>
          </button>

          <!-- Forward 5s -->
          <button type="button" onclick="skipTime(5)" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition-colors" title="Forward 5s">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.934 12.8a1 1 0 000-1.6l-5.334-4A1 1 0 005 8v8a1 1 0 001.6.8l5.334-4zM19.934 12.8a1 1 0 000-1.6l-5.334-4A1 1 0 0013 8v8a1 1 0 001.6.8l5.334-4z"/>
            </svg>
          </button>

          <!-- Timestamp Readout -->
          <div class="font-mono text-slate-400 tabular-nums">
            <span id="currentTimeDisplay" class="text-white font-semibold">00:00</span> / <span id="totalTimeDisplay">02:40</span>
          </div>
        </div>

        <!-- Quick Jump Chapters -->
        <div class="hidden md:flex items-center gap-1.5">
          <button onclick="jumpTo(0)" class="px-2 py-1 rounded bg-slate-800/80 hover:bg-slate-700 text-[11px] text-slate-300">Login</button>
          <button onclick="jumpTo(35)" class="px-2 py-1 rounded bg-slate-800/80 hover:bg-slate-700 text-[11px] text-emerald-400 font-medium">Reader Block</button>
          <button onclick="jumpTo(80)" class="px-2 py-1 rounded bg-slate-800/80 hover:bg-slate-700 text-[11px] text-sky-400 font-medium">Writer Guard</button>
          <button onclick="jumpTo(120)" class="px-2 py-1 rounded bg-slate-800/80 hover:bg-slate-700 text-[11px] text-purple-400 font-medium">Admin DB Drop</button>
        </div>

        <!-- Right Side: Speed & Sound -->
        <div class="flex items-center gap-2">
          <!-- Playback Speed -->
          <button id="speedBtn" onclick="cycleSpeed()" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 font-mono text-[11px] text-slate-300">1.0x</button>
          
          <!-- Sound Toggle -->
          <button id="soundBtn" onclick="toggleAudio()" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white" title="Toggle audio chime">
            <svg id="soundIcon" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Video Playback & Stage State Engine -->
  <script>
    const TOTAL_DURATION = 160; // 2 minutes 40 seconds
    let currentTime = 0;
    let isPlaying = false;
    let playbackSpeed = 1.0;
    let audioEnabled = true;
    let playInterval = null;

    // Web Audio Sound Synthesizer for realistic feedback
    let audioCtx = null;
    function playBeep(type = 'click') {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'click') {
          osc.frequency.setValueAtTime(600, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.05);
        } else if (type === 'error') {
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          osc.type = 'sawtooth';
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        } else if (type === 'success') {
          osc.frequency.setValueAtTime(520, audioCtx.currentTime);
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
        }
      } catch (e) {}
    }

    // Keyframes and Timeline definition
    const SCENES = [
      {
        start: 0,
        end: 35,
        title: "1. Login Screen & MySQL Datacenter Identity",
        subEn: "Modern split showcase with MySQL 8.0 branding & 1-click role auto-fill.",
        subMr: "हाय-टेक MySQL सर्व्हर बॅकग्राउंड, अधिकृत डॉल्फिन लोगो आणि १-क्लिक रोल निवड.",
        render: (t) => renderLoginScene(t)
      },
      {
        start: 35,
        end: 78,
        title: "2. Reader Role — SELECT Works vs UPDATE/DELETE Blocked",
        subEn: "Reader can execute SELECT queries, but mutating UPDATE & DELETE queries are strictly BLOCKED by RBAC.",
        subMr: "रीडरसाठी SELECT सुरळीत चालते, पण UPDATE किंवा DELETE क्वेरी विचारल्यास सिक्युरिटी ब्लॉक होते.",
        render: (t) => renderReaderScene(t)
      },
      {
        start: 78,
        end: 118,
        title: "3. Writer Role — Destructive Confirmation Guard on DELETE",
        subEn: "Writer attempts DELETE -> Halted by Confirmation Guard! User confirms to execute; DDL DROP is blocked.",
        subMr: "रायटरने DELETE विचारल्यास थेट रन न होता कन्फर्मेशन गार्ड उघडेल; DDL DROP पूर्णपणे ब्लॉक राहील.",
        render: (t) => renderWriterScene(t)
      },
      {
        start: 118,
        end: 145,
        title: "4. Admin Role — Multi-DB Target Switching & DB Drop",
        subEn: "Admin switches databases dynamically, creates tables, and drops custom DBs with safe verification.",
        subMr: "ॲडमिन कोणत्याही डेटाबेसवर स्विच करू शकतो, नवीन DB तयार करू शकतो व कन्फर्म करून ड्रॉप करू शकतो.",
        render: (t) => renderAdminScene(t)
      },
      {
        start: 145,
        end: 160,
        title: "5. Production Security Architecture Summary",
        subEn: "Protected with Rate Limiting (express-rate-limit), AST validation, Helmet headers, and connection pooling.",
        subMr: "रेट लिमिटिंग, SQL इंजेक्शन डिफेन्स, आणि तीन स्वतंत्र कनेक्शन पूल्ससह सुरक्षित डिप्लॉयमेंट.",
        render: (t) => renderSummaryScene(t)
      }
    ];

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function togglePlayPause() {
      if (isPlaying) {
        pauseVideo();
      } else {
        playVideo();
      }
    }

    function playVideo() {
      if (currentTime >= TOTAL_DURATION) currentTime = 0;
      isPlaying = true;
      document.getElementById('bigPlayBtn').style.opacity = '0';
      document.getElementById('bigPlayBtn').style.pointerEvents = 'none';
      document.getElementById('playPauseIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      
      clearInterval(playInterval);
      playInterval = setInterval(() => {
        currentTime += 0.5 * playbackSpeed;
        if (currentTime >= TOTAL_DURATION) {
          currentTime = TOTAL_DURATION;
          pauseVideo();
        }
        updateUI();
      }, 500);
      playBeep('click');
    }

    function pauseVideo() {
      isPlaying = false;
      clearInterval(playInterval);
      document.getElementById('bigPlayBtn').style.opacity = '1';
      document.getElementById('bigPlayBtn').style.pointerEvents = 'auto';
      document.getElementById('playPauseIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
      playBeep('click');
    }

    function skipTime(delta) {
      currentTime = Math.max(0, Math.min(TOTAL_DURATION, currentTime + delta));
      updateUI();
      playBeep('click');
    }

    function seekVideo(event) {
      const rect = event.currentTarget.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
      currentTime = pos * TOTAL_DURATION;
      updateUI();
      playBeep('click');
    }

    function jumpTo(time) {
      currentTime = time;
      updateUI();
      if (!isPlaying) playVideo();
    }

    function cycleSpeed() {
      const speeds = [1.0, 1.5, 2.0, 0.5];
      const nextIdx = (speeds.indexOf(playbackSpeed) + 1) % speeds.length;
      playbackSpeed = speeds[nextIdx];
      document.getElementById('speedBtn').innerText = `${playbackSpeed}x`;
      if (isPlaying) {
        playVideo();
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('soundBtn').classList.toggle('text-sky-400', audioEnabled);
      document.getElementById('soundBtn').classList.toggle('text-slate-600', !audioEnabled);
    }

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
      } else if (e.code === 'ArrowRight') {
        skipTime(5);
      } else if (e.code === 'ArrowLeft') {
        skipTime(-5);
      }
    });

    // Update screen and controls every frame
    function updateUI() {
      // Progress Bar & Time
      const pct = (currentTime / TOTAL_DURATION) * 100;
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('scrubberHandle').style.left = `${pct}%`;
      document.getElementById('currentTimeDisplay').innerText = formatTime(currentTime);

      // Find current scene
      const activeScene = SCENES.find(s => currentTime >= s.start && currentTime <= s.end) || SCENES[0];
      document.getElementById('currentChapterTitle').innerText = activeScene.title;
      document.getElementById('subtitleText').innerText = activeScene.subEn;
      document.getElementById('subtitleSub').innerText = activeScene.subMr;

      // Render Stage
      const stage = document.getElementById('screenStage');
      stage.innerHTML = activeScene.render(currentTime - activeScene.start);
    }

    // -------------------------------------------------------------
    // SCENE 1: LOGIN SCREEN (0s - 35s)
    // -------------------------------------------------------------
    function renderLoginScene(relTime) {
      const isTyping = relTime > 12;
      const cursorX = relTime < 10 ? 68 : relTime < 24 ? 65 : 75;
      const cursorY = relTime < 10 ? 35 : relTime < 24 ? 60 : 75;
      
      const cursor = document.getElementById('virtualCursor');
      cursor.style.left = `${cursorX}%`;
      cursor.style.top = `${cursorY}%`;

      return `
        <div class="w-full max-w-2xl bg-slate-900/95 border border-slate-700/80 rounded-2xl shadow-2xl overflow-hidden grid grid-cols-1 sm:grid-cols-2">
          <!-- Left Visual Pane -->
          <div class="relative p-6 flex flex-col justify-between bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 border-r border-slate-800">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-xl bg-sky-950/80 border border-sky-500/40 flex items-center justify-center text-sky-400 font-bold text-sm shadow-md">
                🐬
              </div>
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="font-black text-white text-base">MySQL</span>
                  <span class="bg-amber-500 text-black font-extrabold text-[9px] px-1.5 py-0.2 rounded">8.0</span>
                </div>
                <span class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">AI Database</span>
              </div>
            </div>

            <div class="my-4">
              <h2 class="text-2xl font-black text-white leading-tight">MySQL AI<br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-rose-400">Chatbot.</span></h2>
              <p class="text-[11px] text-slate-400 mt-1.5 leading-relaxed">Verified natural language to SQL with strict RBAC security.</p>
            </div>

            <div class="flex items-center gap-2 text-[10px] text-emerald-400 font-medium">
              <span class="w-2 h-2 rounded-full bg-emerald-500 live-dot"></span>
              <span>Port: 3306 Connected</span>
            </div>
          </div>

          <!-- Right Form Pane -->
          <div class="p-6 bg-white dark:bg-slate-900 flex flex-col justify-between">
            <div>
              <h3 class="text-lg font-black text-slate-900 dark:text-white">Sign In</h3>
              <p class="text-[11px] text-slate-500 dark:text-slate-400">Choose workspace role to auto-fill credentials</p>

              <!-- Role Selector Pills -->
              <div class="grid grid-cols-3 gap-1.5 mt-3">
                <div class="p-1.5 rounded-lg border text-center text-[10px] font-bold ${relTime < 15 ? 'border-sky-500 bg-sky-500/10 text-sky-400 ring-2 ring-sky-500/30' : 'border-slate-800 text-slate-400'}">
                  🛡️ Admin
                </div>
                <div class="p-1.5 rounded-lg border text-center text-[10px] font-bold border-slate-800 text-slate-400">
                  ✍️ Writer
                </div>
                <div class="p-1.5 rounded-lg border text-center text-[10px] font-bold ${relTime >= 15 ? 'border-emerald-500 bg-emerald-500/10 text-emerald-400 ring-2 ring-emerald-500/30' : 'border-slate-800 text-slate-400'}">
                  📖 Reader
                </div>
              </div>

              <!-- Inputs -->
              <div class="mt-3.5 space-y-2">
                <div>
                  <span class="text-[9px] font-bold uppercase tracking-wider text-slate-400">Email ID</span>
                  <div class="border-b-2 border-slate-700 py-1 text-xs text-white font-mono">
                    ${relTime >= 15 ? 'reader@aisql.com' : 'admin@aisql.com'}
                  </div>
                </div>
                <div>
                  <span class="text-[9px] font-bold uppercase tracking-wider text-slate-400">Password</span>
                  <div class="border-b-2 border-slate-700 py-1 text-xs text-slate-400 font-mono">
                    ••••••••••••
                  </div>
                </div>
              </div>
            </div>

            <!-- Login CTA -->
            <div class="mt-4">
              <button class="w-full py-2 rounded-full bg-gradient-to-r from-rose-500 to-rose-600 text-white font-bold text-xs tracking-wider shadow-lg ${relTime >= 24 ? 'scale-95 ring-4 ring-rose-500/40' : ''}">
                ${relTime >= 24 ? 'AUTHENTICATING...' : 'LOGIN'}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------
    // SCENE 2: READER ROLE (35s - 78s)
    // -------------------------------------------------------------
    function renderReaderScene(relTime) {
      const isAskingSelect = relTime < 22;
      const isAskingDelete = relTime >= 22;
      
      const cursor = document.getElementById('virtualCursor');
      cursor.style.left = isAskingSelect ? '60%' : '75%';
      cursor.style.top = isAskingSelect ? '55%' : '70%';

      return `
        <div class="w-full max-w-3xl h-[90%] bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col shadow-2xl">
          <!-- Top Role Status Bar -->
          <div class="bg-slate-950 px-4 py-2 border-b border-slate-800 flex items-center justify-between text-xs">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 font-bold text-[10px]">📖 Reader (Strict Read-Only)</span>
              <span class="text-slate-500">•</span>
              <span class="text-slate-300 font-mono text-[11px]">ai_sql_assistant</span>
            </div>
            <div class="text-[10px] text-slate-400 font-mono">Max 100 Rows • Pool: readerDB</div>
          </div>

          <!-- Chat Messages Area -->
          <div class="flex-1 p-3.5 space-y-3 overflow-y-auto font-sans">
            <!-- User Prompt 1 -->
            <div class="flex justify-end">
              <div class="bg-sky-600 text-white text-xs px-3.5 py-1.5 rounded-xl rounded-tr-none max-w-sm shadow-md">
                Show all products with price greater than 5000
              </div>
            </div>

            <!-- Bot Response 1 (SELECT SUCCESS) -->
            <div class="flex gap-2 items-start">
              <div class="w-6 h-6 rounded-lg bg-sky-500 text-white text-[11px] flex items-center justify-center font-bold">AI</div>
              <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl p-2.5 max-w-lg text-xs space-y-2">

                <table class="w-full text-left text-[10px] text-slate-300 border-collapse">
                  <tr class="border-b border-slate-700 text-slate-500 font-mono">
                    <th class="py-0.5">ID</th><th>Product</th><th>Price</th><th>Stock</th>

                    <span>⛔ Security Policy Violation</span>
                  </div>
                  <p class="text-slate-200 text-[11px]">Your <strong>reader</strong> role cannot execute <code>DELETE</code> queries. Reader role is strictly limited to read-only <code>SELECT</code> queries.</p>
                </div>
              </div>
            ` : ''}
          </div>

          <!-- Bottom Prompt Input -->
          <div class="p-2.5 bg-slate-950 border-t border-slate-800 flex gap-2">
            <input type="text" readonly value="${isAskingDelete ? 'Delete all inactive customers' : 'Show all products with price greater than 5000'}" class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-300 font-sans" />
            <button class="px-3 py-1.5 rounded-lg bg-sky-500 text-white font-bold text-xs">Send</button>

        </div>

    // -------------------------------------------------------------

    function renderWriterScene(relTime) {
      const isConfirmed = relTime >= 20;
      const cursor = document.getElementById('virtualCursor');
      cursor.style.left = isConfirmed ? '45%' : '65%';

        <div class="w-full max-w-3xl h-[90%] bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col shadow-2xl">

          <div class="bg-slate-950 px-4 py-2 border-b border-slate-800 flex items-center justify-between text-xs">

              <span class="px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-400 border border-sky-500/40 font-bold text-[10px]">✍️ Writer (Data Mutation Permitted)</span>

              <span class="text-slate-300 font-mono text-[11px]">ai_sql_assistant</span>

              <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl p-3 max-w-lg text-xs space-y-2.5">
                <p class="text-slate-300 text-[11px]">I generated the following MySQL query for your request:</p>
                
                <div class="bg-slate-950 p-2 rounded-lg font-mono text-[10px] text-rose-300 border border-slate-800">
                  <code>DELETE FROM \`customers\` WHERE \`status\` = 'inactive';</code>
                </div>

                <!-- Confirmation Guard Card -->
                ${!isConfirmed ? `
                  <div class="p-3 rounded-lg bg-rose-950/40 border border-rose-500/50 space-y-2 animate-pulse">

                      <span>⚠️ Confirmation Required to Run DELETE</span>
                    </div>
                    <p class="text-slate-300 text-[11px]">This operation will permanently delete records from <strong>customers</strong> table in database <strong>ai_sql_assistant</strong>. Are you sure?</p>

                      <button class="px-3 py-1 rounded bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs shadow-md">

                      <button class="px-2.5 py-1 rounded bg-slate-800 text-slate-300 text-xs">

                  <div class="p-2.5 rounded-lg bg-emerald-950/40 border border-emerald-500/40 flex items-center gap-2 text-emerald-400 font-medium text-xs">
                    <span>✓</span>
                    <span>Successfully executed DELETE query. <strong>3 rows affected</strong> on database ai_sql_assistant.</span>
                  </div>
                `}
              </div>
            </div>
          </div>

          <div class="p-2.5 bg-slate-950 border-t border-slate-800 flex gap-2">
            <input type="text" readonly value="Delete customers whose status is inactive" class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-300" />
            <button class="px-3 py-1.5 rounded-lg bg-sky-500 text-white font-bold text-xs">Send</button>
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------

    function renderAdminScene(relTime) {
      const showModal = relTime >= 12;
      const cursor = document.getElementById('virtualCursor');

      return `
        <div class="w-full max-w-3xl h-[90%] bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col shadow-2xl relative">

          <div class="bg-slate-950 px-4 py-2 border-b border-slate-800 flex items-center justify-between text-xs">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-400 border border-purple-500/40 font-bold text-[10px]">👑 Admin (Full DDL &amp; DB Control)</span>

            <div class="grid grid-cols-2 gap-3">

              <div class="p-3 rounded-xl bg-slate-800/80 border border-slate-700/80 space-y-2">
                <div class="flex justify-between items-center">
                  <span class="font-bold text-xs text-white">ai_sql_assistant</span>
                  <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded font-mono">Protected</span>
                </div>
                <div class="text-[10px] text-slate-400">6 Tables • MySQL 8.0 Primary Production</div>
              </div>

              <!-- DB Card 2 (Custom user DB with Admin Delete) -->
